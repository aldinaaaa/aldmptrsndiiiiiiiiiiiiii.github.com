<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuuu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(3deg); }
            40% { transform: rotate(0deg); }
            60% { transform: rotate(-3deg); }
            80% { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes angelRotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #52677D, #020C1B);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spotify-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(to bottom, rgba(10, 25, 47, 0.8), #020C1B);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 60px rgba(0,0,0,0.5);
            animation: scaleIn 0.6s ease-out;
        }

        .photo-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .main-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
        }

        .sticker {
            position: absolute;
            width: 70px;
            height: 70px;
            z-index: 2;
            animation: shake 2s ease-in-out infinite;
        }

        .sticker-1 { 
            top: 15px; 
            left: 20px;
            animation-delay: 0.4s;
        }
        .sticker-2 { 
            top: 15px; 
            right: 20px;
            animation-delay: 0.6s;
        }
        .sticker-3 { 
            bottom: 20px;
            left: 20px;
            animation-delay: 0.8s;
        }
        .sticker-5 { 
            bottom: 20px; 
            right: 20px; 
            width: 60px; 
            height: 60px;
            animation-delay: 1s;
        }

        .player-info {
            padding: 0 10px;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        .song-info {
            margin-bottom: 20px;
            text-align: center;
        }

        .song-title {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            color: #fff;
        }

        .artist-name {
            font-size: 16px;
            margin: 5px 0;
            color: #8892b0;
        }

        .progress-container {
            padding: 10px 0;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }

        .progress-bar:hover {
            height: 6px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #FFD700;
            border-radius: 2px;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8892b0;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin: 20px 0;
        }

        .control-button {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 10px;
        }

        .control-button:hover {
            color:#FFD662;
            transform: scale(1.1);
        }

        .play-button {
            background: none;
            border: none;
            color: #FFD662;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .play-button:hover {
            transform: scale(1.1);
            color: #FFD662;
        }

    </style>
</head>
<body>
    <div class="spotify-container">
        <div class="photo-container">
            <img id="main-photo" src="WhatsApp Image 2025-01-12 at 23.42.46_bb9e0eee.jpg" alt="Foto utama" class="main-photo">
            <img src="WhatsApp_Image_2025-01-13_at_10.42.19_5da86470-removebg-preview.png" alt="Emoji lampu" class="sticker sticker-1">
            <img src="WhatsApp_Image_2025-01-13_at_10.45.58_cb25a2c5-removebg-preview.png" alt="Emoji musik" class="sticker sticker-2">
            <img src="WhatsApp_Image_2025-01-13_at_11.18.53_5d30c94e-removebg-preview.png" alt="Sticker 3" class="sticker sticker-3">
            <img src="WhatsApp_Image_2025-01-13_at_11.18.53_8fcf6fe3-removebg-preview.png" alt="Stiker dinosaurus" class="sticker sticker-5">
        </div>

        <div class="player-info">
            <div class="song-info">
                <p id="song-title" class="song-title">Cincin</p>
                <p id="artist-name" class="artist-name">Hindia</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">4:26</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-button" id="prevButton">⏮</button>
                <button class="play-button" id="playButton">▶</button>
                <button class="control-button" id="nextButton">⏭</button>
            </div>
        </div>
    </div>

    <audio id="background-music" loop>
        <source id="audio-source" src="WhatsApp Audio 2025-01-13 at 13.08.02_64effb86.mp3" type="audio/mpeg">
    </audio>

    <script>
        const playButton = document.getElementById('playButton');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const audio = document.getElementById('background-music');
        const progress = document.querySelector('.progress');
        const currentTimeElement = document.getElementById('current-time');
        const durationTimeElement = document.getElementById('duration-time');
        const songTitleElement = document.getElementById('song-title');
        const artistNameElement = document.getElementById('artist-name');
        const mainPhotoElement = document.getElementById('main-photo');
        const audioSource = document.getElementById('audio-source');
        let isPlaying = false;
        let currentTrackIndex = 0;

        const tracks = [
            {
                title: "Cincin",
                artist: "Hindia",
                image: "WhatsApp Image 2025-01-12 at 23.42.46_bb9e0eee.jpg",
                audioSrc: "WhatsApp Audio 2025-01-13 at 13.08.02_64effb86.mp3"
            },
            {
                title: "Rumah Ke Rumah",
                artist: "Hindia",
                image: "WhatsApp Image 2025-01-12 at 23.42.33_1f545fe8.jpg", 
                audioSrc: "WhatsApp Audio 2025-01-13 at 13.32.04_43ca3c79.mp3" 
            },
            {
                title: "Setiap Waktu",
                artist: "Hindia",
                image: "WhatsApp Image 2025-01-12 at 23.42.49_daa0d9e0.jpg", 
                audioSrc: "WhatsApp Audio 2025-01-13 at 13.31.58_87acef1f.mp3" 
            },
        ];

        audio.addEventListener('loadedmetadata', () => {
            const duration = audio.duration;
            const durationMinutes = Math.floor(duration / 60);
            const durationSeconds = Math.floor(duration % 60);
            durationTimeElement.textContent = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
        });

        playButton.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playButton.textContent = '▶';
            } else {
                audio.play();
                playButton.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        prevButton.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex === 0) ? tracks.length - 1 : currentTrackIndex - 1;
            loadTrack();
        });

        nextButton.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack();
        });

        audio.addEventListener('play', () => {
            updateProgress();
        });

        function updateProgress() {
            if (!audio.paused) {
                const currentTime = audio.currentTime;
                const duration = audio.duration;
                const progressWidth = (currentTime / duration) * 100;
                progress.style.width = `${progressWidth}%`;

                const minutes = Math.floor(currentTime / 60);
                const seconds = Math.floor(currentTime % 60);
                currentTimeElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                requestAnimationFrame(updateProgress);
            }
        }

        function loadTrack() {
            const track = tracks[currentTrackIndex];
            songTitleElement.textContent = track.title;
            artistNameElement.textContent = track.artist;

            mainPhotoElement.style.opacity = '0';

            setTimeout(() => {
                mainPhotoElement.src = track.image;
                mainPhotoElement.style.opacity = '1';
            }, 500); 
            audioSource.src = track.audioSrc;

            audio.load();
            if (isPlaying) {
                audio.play();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
